name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install -r requirements-dev.txt
      - name: Build wheel
        run: python -m build --wheel
      - name: Install wheel
        run: python -m pip install --no-deps dist/*.whl
      - name: Test installed wheel outside the repository
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/.."
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - uses: actions/upload-artifact@v4
        with:
          name: demo-date-wheel
          path: dist/*.whl
          if-no-files-found: error
