name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate tag against package metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          metadata = tomllib.loads(Path("pyproject.toml").read_text())
          expected = "v" + metadata["project"]["version"]
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"Release tag must match package version: {expected}")
          PY
      - name: Install build tools
        run: python -m pip install -r requirements-dev.txt
      - name: Build wheel once
        run: python -m build --wheel
      - name: Install wheel
        run: python -m pip install --no-deps dist/*.whl
      - name: Test installed wheel outside the repository
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/.."
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.whl > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Create release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.whl dist/SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" \
            --notes "Versioned Python wheel and SHA-256 checksums. No PyPI publication."

  notify-workloads:
    needs: release
    if: vars.WORKLOADS_REPOSITORY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Request downstream pin update PR
        env:
          GH_TOKEN: ${{ secrets.WORKLOADS_DISPATCH_TOKEN }}
          WORKLOADS_REPOSITORY: ${{ vars.WORKLOADS_REPOSITORY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "Configure WORKLOADS_DISPATCH_TOKEN with downstream Actions write access." >&2
            exit 1
          fi
          gh workflow run update-pin.yml --repo "$WORKLOADS_REPOSITORY" \
            --ref main --field "tag=$RELEASE_TAG"
